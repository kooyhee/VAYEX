<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>VAYEX — 화면 회귀 검사</title><style>body{margin:0;padding:16px;background:#1f1f1f;color:#ededed;font:13px/1.5 system-ui,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Consolas,monospace}#fixture iframe{width:100%;height:700px;border:0;display:block}</style></head>
<body><h1 style="font-size:16px">VAYEX — 화면 회귀 검사</h1><p>격리된 브라우저 검사입니다. 실제 코어, 모델, 클라우드 또는 SSH를 호출하지 않습니다.</p><pre id="results">검사 중…</pre><div id="fixture"></div>
<script type="module">
const results = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); };
async function until(check, doc = document) {
  if (check()) return;
  await new Promise((resolve, reject) => {
    const observer = new MutationObserver(() => { if (check()) finish(); });
    const timeout = setTimeout(() => finish(new Error('Timed out waiting for fixture state')), 5000);
    function finish(error) { observer.disconnect(); clearTimeout(timeout); error ? reject(error) : resolve(); }
    observer.observe(doc, { subtree:true, childList:true, attributes:true, characterData:true });
  });
}
const consoleErrors = [];
let currentTest = '';
async function fixture(run) {
  const frame = document.createElement('iframe');
  frame.title = '격리된 실제 화면'; frame.style.cssText = 'width:100%;height:700px;border:0';
  const source = await (await fetch('./index.html')).text();
  const setup = () => {
    const config = {
      mock:true,
      defaultRoute:'any_cloud',
      route:{ route:'any_cloud',consent:false,invalid:null },
      local:{ provider:'mock',model:'local-test',available:true,label:'Local fixture',reason:'Browser fixture only' },
      background:{ available:false,label:'Unavailable fixture',reason:'Not configured' },
      cloud:{ provider:'mock',model:'cloud-test',label:'Cloud fixture',reason:'No external calls' }
    };
    window.testFetches = [];
    window.testErrors = [];
    window.testConfig = config;
    window.addEventListener('error',event => window.testErrors.push(String(event.message)));
    window.addEventListener('unhandledrejection',event => window.testErrors.push(String(event.reason)));
    const report = console.error;
    console.error = (...args) => { window.testErrors.push(args.map(String).join(' ')); report.apply(console,args); };
    window.fetch = async url => {
      const asked = new URL(url, document.baseURI);
      window.testFetches.push(asked);
      // Echo the conversation route the way the real bridge does: consent off on a
      // cloud route reconciles to local_only and reports what was requested.
      const base = window.testConfig;
      const requested = asked.searchParams.get('route');
      const consent = asked.searchParams.get('consent') === '1';
      const cloud = requested === 'zdr_cloud' || requested === 'any_cloud';
      const server = base.route?.invalid ? { route:'local_only', consent:false, invalid:base.route.invalid, requested, fallback:'invalid_route' }
        : !cloud ? { route:requested ?? 'local_only', consent:false, invalid:null, requested, fallback:null }
        : !consent ? { route:'local_only', consent:false, invalid:null, requested, fallback:'consent_off' }
        : { route:requested, consent:true, invalid:null, requested, fallback:null };
      const served = base.route?.served;
      return new Response(JSON.stringify({ ...base, route:{ ...server, ...(served === undefined ? {} : { served, servedReason:base.route.servedReason }) } }));
    };
    window.testSockets = [];
    window.WebSocket = class extends EventTarget {
      static OPEN = 1;
      readyState = 1;
      sent = [];
      model = 'local-test';
      constructor(url) { super(); this.url = new URL(url, location.href); window.testSockets.push(this); queueMicrotask(() => this.frame({ type:'bridge_ready' })); }
      frame(data) { this.dispatchEvent(new MessageEvent('message', { data:JSON.stringify(data) })); }
      send(raw) {
        const command = JSON.parse(raw); this.sent.push(command);
        if (command.type === 'get_state') queueMicrotask(() => this.frame({ type:'response',command:'get_state',id:command.id,success:true,data:{ model:window.testConfig.reportModel === false ? null : { provider:'mock',id:this.model },isStreaming:false,isCompacting:false } }));
      }
      close() { this.readyState = 3; this.dispatchEvent(new Event('close')); }
    };
  };
  frame.srcdoc = source.replace('<head>', `<head><base href="${new URL('./', location.href)}"><script>(${setup.toString()})()<` + '/script>');
  document.querySelector('#fixture').append(frame);
  try {
    await new Promise(resolve => frame.addEventListener('load', resolve, { once:true }));
    const win = frame.contentWindow, doc = win.document;
    await until(() => win.testSockets?.length && (doc.querySelector('#connection').dataset.state === 'ready' || !doc.querySelector('#send-reason').hidden), doc);
    // Consent starts off by design; the visible toggle is the operator's explicit act.
    if (!doc.querySelector('#cloud-consent').checked) doc.querySelector('#consent-toggle').click();
    await until(() => doc.querySelector('#connection').dataset.state === 'ready' && !doc.querySelector('#send').disabled, doc);
    // The suite's socket/fetch counts describe the session after the operator act; keep the pre-consent trail apart.
    win.initialFetches = win.testFetches.splice(0, win.testFetches.length - 1);
    win.testSockets.splice(0, win.testSockets.length - 1);
    const change = (selector, value) => { const el = doc.querySelector(selector); if (el.type === 'checkbox') el.checked = value; else el.value = value; el.dispatchEvent(new win.Event('change', { bubbles:true })); };
    try {
      await run({ win,doc,change,socket:() => win.testSockets.at(-1) });
    } catch (error) {
      const facts = `state=${doc.querySelector('#connection')?.dataset.state} send=${doc.querySelector('#send')?.disabled} reason=${doc.querySelector('#send-reason')?.textContent?.slice(0,120)} sockets=${win.testSockets?.length} fetches=${win.testFetches?.map(u => u.pathname + u.search).join(' ')} errors=${(win.testErrors ?? []).join(' | ')}`;
      throw new Error(`${error.message} [${facts}]`);
    }
  } finally {
    for (const error of frame.contentWindow?.testErrors ?? []) consoleErrors.push(`${currentTest}: ${error}`);
    frame.remove();
  }
}
async function test(name, run) {
  currentTest = name;
  try { await fixture(run); results.push({ name,status:'pass' }); }
  catch (error) { results.push({ name,status:'fail',error:error.message }); }
  document.querySelector('#results').textContent = JSON.stringify(results, null, 2);
}

await test('The command catalog popup, the sidebar command row and the approval scope are gone', async ({ win,doc,socket }) => {
  const gone = () => [...['modes','modes-pop','modes-source','modes-list','menu-commands','scope'].filter(id => doc.getElementById(id))];
  assert(!gone().length, `Deleted surfaces are back: ${gone().join(', ')}`);
  assert(!doc.querySelector('.modes-pop,.pop-head,.pop-list,.pop-item,.ctl-note'), 'Deleted popup markup is back');
  assert(!/매번 확인/.test(doc.body.textContent), 'An ask-every-time option is still rendered');
  socket().frame({ type:'available_commands_update', commands:[{ name:'alpha',description:'First catalog' }] });
  socket().frame({ type:'available_commands_update', commands:[{ name:'beta',description:'Second catalog' },{ name:'gamma' }] });
  doc.querySelector('#new-session').click();
  await until(() => win.testSockets.length === 2 && doc.querySelector('#connection').dataset.state === 'ready', doc);
  win.testSockets.at(-1).frame({ type:'available_commands_update', commands:[{ name:'delta' }] });
  assert(!win.testErrors.length, `A catalog frame threw: ${win.testErrors.join(' | ')}`);
  assert(!gone().length, `A catalog frame recreated: ${gone().join(', ')}`);
  assert(!doc.querySelector('.modes-pop,.pop-item'), 'A catalog frame opened a popup');
});

for (const [code,detail] of [
  ['consent_required','클라우드'],
  ['invalid_route','local_only']]) await test(`${code} ends the socket as a distinct refusal, not an outage`, async ({ win,doc,socket }) => {
  const failed = socket(), count = win.testSockets.length, sent = failed.sent.length;
  failed.frame({ type:'bridge_error',code });
  const state = doc.querySelector('#connection').dataset.state;
  assert(state === 'refused', `Failure is not a refusal state (state=${state})`);
  const label = doc.querySelector('#connection-label').textContent;
  assert(/[가-힣]/.test(label) && !label.includes('연결할 수 없'), `Refusal lost its distinct Korean label: ${label}`);
  const refusal = doc.querySelector('#transcript .refusal-box');
  assert(refusal?.dataset.state === 'refused', 'Failure did not render a refusal box');
  assert(refusal.textContent.includes(detail), `Failure did not explain the policy outcome: ${refusal.textContent}`);
  assert(/실행되지 않았습니다|실행하지 않았습니다/.test(refusal.textContent), `Refusal omitted the no-process-started guarantee: ${refusal.textContent}`);
  assert(code !== 'invalid_route' || refusal.textContent.includes('local_only'), 'Invalid route was not explained');
  assert(code !== 'consent_required' || refusal.textContent.includes('클라우드'), 'Cloud consent requirement was not explicit');
  assert(failed.readyState === 3, 'Terminal refusal left the socket open');
  failed.frame({ type:'bridge_ready' }); failed.dispatchEvent(new win.Event('error'));
  doc.querySelector('#composer').requestSubmit();
  assert(failed.sent.length === sent && win.testSockets.length === count, 'Terminal refusal retried or dispatched commands');
  assert(doc.querySelector('#connection').dataset.state === 'refused' && doc.querySelector('#send').disabled, 'Terminal refusal was overwritten');
});

await test('Unavailable policy probes render consent refusal rather than bridge outage', async ({ win,doc,change,socket }) => {
  const previous = socket();
  win.testConfig = { ...win.testConfig, mock:false,
    route:{ route:'zdr_cloud',consent:false,invalid:null },
    local:{ ...win.testConfig.local,available:false,reason:'Cloud route requires explicit consent before probing.' },
    background:{ available:false,reason:'Cloud route requires explicit consent before probing.' }
  };
  change('#route','zdr_cloud');
  await until(() => socket() !== previous && doc.querySelector('#connection').dataset.state === 'refused', doc);
  assert(doc.querySelector('#connection').dataset.state === 'refused', 'Policy refusal rendered as an outage or readiness');
  assert(doc.querySelector('#model-status').dataset.state === 'refused', 'Model status did not expose refusal');
  assert(doc.querySelector('#model-status').textContent.includes('requires explicit consent'), `Reported refusal reason was hidden: ${doc.querySelector('#model-status').textContent}`);
  assert(!doc.querySelector('#transcript .error-box'), 'Policy refusal was styled as a bridge error');
});

await test('Route and consent plumbing still drive the probe, the socket and socket replacement', async ({ win,doc,change,socket }) => {
  const query = (url,route,consent) => {
    assert(url.searchParams.get('route') === route, `Wrong route: ${url}`);
    assert(url.searchParams.get('consent') === consent, `Wrong consent: ${url}`);
    assert(!url.searchParams.has('session'), 'Authorization change reused a bridge session');
  };
  query(win.testFetches.at(-1),'any_cloud','1'); query(socket().url,'any_cloud','1');
  for (const route of ['zdr_cloud','any_cloud']) {
    const previous = socket();
    change('#route',route);
    assert(previous.readyState === 3, 'Route change kept the old socket open');
    await until(() => socket() !== previous && socket().url.searchParams.get('route') === route, doc);
    query(win.testFetches.at(-1),route,'0'); query(socket().url,route,'0');
    assert(doc.querySelector('#send').disabled, `${route} sends without consent`);
    const unconsented = socket();
    change('#cloud-consent',true);
    assert(unconsented.readyState === 3, 'Consent grant kept the old authorization');
    await until(() => socket() !== unconsented && !doc.querySelector('#send').disabled, doc);
    query(win.testFetches.at(-1),route,'1'); query(socket().url,route,'1');
    previous.frame({ type:'bridge_error',code:'transport_closed',message:'stale socket' });
    assert(!doc.querySelector('#transcript').textContent.includes('stale socket'), 'A replaced socket changed the active UI');
    assert(doc.querySelector('#connection').dataset.state === 'ready', 'A replaced socket changed the connection state');
  }
  change('#route','local_only');
  await until(() => socket().url.searchParams.get('route') === 'local_only' && !doc.querySelector('#send').disabled, doc);
  query(win.testFetches.at(-1),'local_only','0'); query(socket().url,'local_only','0');
});

// Consent is granted only by the visible toggle, never by a constant.
await test('Consent off shows the inline reason, disables send and sends nothing until the toggle is used', async ({ win,doc,socket }) => {
  assert(win.initialFetches[0].searchParams.get('route') === 'any_cloud' && win.initialFetches[0].searchParams.get('consent') === '0', `A fresh page did not start unconsented on the served route: ${win.initialFetches[0]}`);
  // The fixture's operator act turned consent on; the visitor-facing toggle revokes it first.
  doc.querySelector('#consent-toggle').click();
  const revoked = win.testSockets.length;
  await until(() => win.testSockets.length === revoked + 1 && doc.querySelector('#send').disabled, doc);
  assert(!doc.querySelector('#cloud-consent').checked, 'The toggle did not record the operator turning consent off');
  assert(!doc.querySelector('#send-reason').hidden && doc.querySelector('#send-reason').textContent.includes('외부 모델 사용에 동의해야'), `The consent reason is not shown inline before the first send: ${doc.querySelector('#send-reason').textContent}`);
  assert(!socket().sent.some(x => x.type === 'prompt'), 'A request went out without consent');
  doc.querySelector('#prompt').value = 'consent gate prompt';
  doc.querySelector('#composer').requestSubmit();
  assert(!socket().sent.some(x => x.type === 'prompt'), 'A submit bypassed the consent gate');
  doc.querySelector('#consent-toggle').click();
  const consented = win.testSockets.length;
  await until(() => win.testSockets.length === consented + 1 && !doc.querySelector('#send').disabled, doc);
  assert(doc.querySelector('#cloud-consent').checked && socket().url.searchParams.get('consent') === '1', 'The visible toggle did not grant consent');
  assert(doc.querySelector('#send-reason').hidden, 'The consent gate stayed visible after the toggle');
  doc.querySelector('#prompt').value = 'fresh session prompt';
  doc.querySelector('#composer').requestSubmit();
  assert(socket().sent.some(x => x.type === 'prompt' && x.message === 'fresh session prompt'), 'A consented prompt did not round-trip');
  assert(!doc.querySelector('.approval') && !doc.querySelector('#approvals .approval'), 'A prompt opened an approval dialog');
  win.testConfig = { ...win.testConfig, route:{ route:'any_cloud',consent:true,invalid:null,served:false,servedReason:'로컬 모델이 실행 중이 아닙니다.' } };
  doc.querySelector('#new-session').click();
  const unserved = win.testSockets.length;
  await until(() => win.testSockets.length === unserved + 1 && doc.querySelector('#send').disabled && !doc.querySelector('#send-reason').hidden, doc);
  assert(doc.querySelector('#send-reason').textContent.includes('로컬 모델이 실행 중이 아닙니다'), 'An unserved route is not shown before the first send');
  assert(!socket().sent.some(x => x.type === 'prompt'), 'A request went out on an unserved route');
  win.testConfig = { ...win.testConfig, route:{ route:'any_cloud',consent:true,invalid:null } };
});

await test('Approval drafts and focus survive unrelated renders and are cleared when resolved', async ({ win,doc,change,socket }) => {
  const request = (id,method,prefill) => socket().frame({ type:'extension_ui_request',id,method,title:`${method} fixture`,prefill });
  const field = id => doc.getElementById(`value-${id}`);
  request('input-a','input','original input'); request('editor-b','editor','original editor');
  field('input-a').value = 'unsent input draft'; field('input-a').dispatchEvent(new win.Event('input',{ bubbles:true }));
  field('editor-b').value = 'unsent editor draft\nsecond line'; field('editor-b').dispatchEvent(new win.Event('input',{ bubbles:true }));
  field('editor-b').focus(); field('editor-b').setSelectionRange(3,12,'backward');
  socket().frame({ type:'turn_start' });
  socket().frame({ type:'response',command:'get_state',success:true,data:{ thinkingLevel:'medium' } });
  assert(doc.querySelector('#approvals .approval'), 'Approval cards are hosted by the center column container');
  assert(field('input-a').value === 'unsent input draft', 'Input draft lost during unrelated render');
  assert(field('editor-b').value === 'unsent editor draft\nsecond line', 'Editor draft lost during unrelated render');
  assert(doc.activeElement === field('editor-b'), 'Editor focus lost during unrelated render');
  assert(field('editor-b').selectionStart === 3 && field('editor-b').selectionEnd === 12 && field('editor-b').selectionDirection === 'backward', 'Editor caret/selection lost during unrelated render');
  field('input-a').closest('.approval').querySelector('button').click();
  assert(socket().sent.some(x => x.type === 'extension_ui_response' && x.id === 'input-a' && x.value === 'unsent input draft'), 'Submitted approval did not use draft');
  assert(!field('input-a'), 'Submitted request field retained');
  socket().frame({ type:'extension_ui_request',method:'cancel',targetId:'editor-b' });
  assert(!field('editor-b'), 'Cancelled request field retained');
  request('input-a','input','fresh input'); request('editor-b','editor','fresh editor');
  assert(field('input-a').value === 'fresh input' && field('editor-b').value === 'fresh editor', 'Resolved request reused stale draft');
  doc.querySelector('#abort').click();
  assert(!doc.querySelector('.approval'), 'Aborted request retained');
  request('input-a','input','before reset'); field('input-a').value = 'discard on session reset';
  doc.querySelector('#new-session').click();
  await until(() => win.testSockets.length === 2 && doc.querySelectorAll('#recent-list .recent-sub').length >= 2, doc);
  assert(!doc.querySelector('.approval'), 'New session retained old approval');
  request('input-a','input','new session input');
  assert(field('input-a').value === 'new session input', 'New session reused prior approval draft');
});

await test('The agent list stays empty until the core reports and then renders exactly the reported rows', async ({ win,doc,socket }) => {
  const rows = () => [...doc.querySelectorAll('#agent-list .agent-row')];
  assert(rows().length === 0, `Agent rows are rendered before any report: ${rows().length}`);
  assert(doc.querySelector('#agent-list .agent-empty')?.textContent === '브리지가 하위 에이전트 현황을 아직 보고하지 않았습니다.', `The not-reported empty state is not distinct: ${doc.querySelector('#agent-list .agent-empty')?.textContent}`);
  assert(doc.querySelector('#agents-count').textContent === '보고 없음', `Unreported agent counter is not 보고 없음: ${doc.querySelector('#agents-count').textContent}`);
  assert(!doc.querySelector('.demo-tag,.demo-note,#agents-tag'), 'A demo agent marker is still rendered');
  assert(!/예시/.test(doc.querySelector('#agents').textContent), 'The agents card still carries demo copy');
  socket().frame({ type:'response',command:'get_subagents',success:true,data:{ subagents:[
    { id:'agent-a',name:'조사',status:'completed',model:'local/model-a' },
    { id:'agent-b',name:'구현',status:'running',detail:'배치 확인' }
  ] } });
  await until(() => rows().length === 2, doc);
  assert(rows().map(row => row.dataset.state).join(',') === 'completed,running', `Reported rows lost their states: ${rows().map(row => row.dataset.state).join(',')}`);
  assert(doc.querySelector('#agents-count').textContent === '1/2', `Agent counter is not running/total: ${doc.querySelector('#agents-count').textContent}`);
  assert(rows()[0].textContent.includes('조사') && rows()[1].textContent.includes('구현'), 'Reported agent names are missing');
  assert(rows()[0].textContent.includes('local/model-a'), 'A reported model id is missing from its row');
  assert(!doc.querySelector('.demo-tag') && !/예시/.test(doc.querySelector('#agents').textContent), 'Demo copy survived a real report');
  const second = rows()[1], disc = second.querySelector('.agent-disc'), detail = second.querySelector('.agent-detail');
  const initial = detail.hidden;
  assert(disc.getAttribute('aria-expanded') === String(!initial), 'The disclosure state disagrees with the reported detail');
  disc.click();
  assert(detail.hidden === !initial && disc.getAttribute('aria-expanded') === String(initial), 'Disclosure did not toggle the reported detail');
  disc.click();
  assert(detail.hidden === initial && disc.getAttribute('aria-expanded') === String(!initial), 'Disclosure did not restore the reported detail');
  assert(second.querySelector('.agent-status').textContent.includes('실행 중'), 'A running row lost its status pill');
  doc.querySelector('#agents-graph').click();
  assert(doc.querySelector('#agent-graph').hidden === false && doc.querySelector('#agent-list').hidden === true, 'Graph view does not replace the list');
  assert(doc.querySelectorAll('#agent-graph svg circle').length === 3, 'Graph view does not draw the session plus both reported agents');
  doc.querySelector('#agents-list').click();
  assert(rows().length === 2, 'List view lost the reported rows');
  const running = [...doc.querySelectorAll('#running-rows li:not(.agent-empty)')];
  assert(running.length === 2 && running.some(row => row.textContent.includes('구현')), 'The running card does not mirror the reported agents');
});

await test('Measured values come only from the core report and no demo figure is rendered before it', async ({ win,doc,socket }) => {
  assert(!doc.querySelector('.demo-tag,.demo-note'), 'A demo marker is still rendered');
  assert(doc.querySelector('#head-meta').textContent === '토큰 미보고' || doc.querySelector('#head-meta').textContent === '측정값 없음', `Unreported usage is not the unreported wording: ${doc.querySelector('#head-meta').textContent}`);
  assert(doc.querySelector('#foot-right').textContent === '토큰 미보고', `Unreported context is not the unreported wording: ${doc.querySelector('#foot-right').textContent}`);
  assert(doc.querySelector('#ctx-percent').textContent === '사용률 미확인' && doc.querySelector('#ctx-total').textContent === '미확인', `Unreported context card claims a value: ${doc.querySelector('#ctx-percent').textContent} / ${doc.querySelector('#ctx-total').textContent}`);
  assert(doc.querySelector('#ctx-bar').getAttribute('aria-label') === '컨텍스트 사용량은 보고되지 않았습니다', 'The unreported context bar does not say so');
  assert(!doc.querySelector('#running-rows li:not(.agent-empty)'), 'Unreported running rows render demo entries');
  assert(!doc.querySelector('.thread-title,.user-bubble'), 'A demo transcript is rendered before any message');
  socket().frame({ type:'response',command:'get_session_stats',success:true,data:{ tokens:{ total:24600 },cost:0.051,contextUsage:{ tokens:18400,contextWindow:200000,percent:9 } } });
  await until(() => doc.querySelector('#head-meta').textContent.includes('24.6k'), doc);
  assert(doc.querySelector('#foot-right').textContent.startsWith('200.0k 중 9%'), `Reported context does not drive the ring label: ${doc.querySelector('#foot-right').textContent}`);

  socket().frame({ type:'message_start', message:{ role:'user', content:[{ type:'text',text:'make the settings page accessible' }] } });
  socket().frame({ type:'message_end', message:{ role:'user', content:[{ type:'text',text:'make the settings page accessible' }] } });

  assert(doc.querySelector('.user-bubble')?.textContent === 'make the settings page accessible', 'The reported prompt is not rendered');
  assert(!doc.querySelector('.thread-title'), 'A demo result block is rendered next to real messages');
});

await test('Composer preserves a draft while cloud consent is pending and dispatches after acknowledgement', async ({ win,doc,change,socket }) => {
  const prompt = doc.querySelector('#prompt');
  prompt.value = 'draft that must survive';
  const previous = socket();
  change('#cloud-consent',false);
  await until(() => socket() !== previous && doc.querySelector('#send-reason').textContent.includes('동의'), doc);
  assert(doc.querySelector('#send').disabled, 'Cloud prompt is gated on consent');
  assert(doc.querySelector('#send-reason').hidden === false && /[가-힣]/.test(doc.querySelector('#send-reason').textContent), 'Consent gate explains why sending is blocked');
  assert(prompt.value === 'draft that must survive', 'Composer draft survived reconnection');
  doc.querySelector('#composer').requestSubmit();
  assert(!socket().sent.some(x => x.type === 'prompt'), 'Unacknowledged prompt dispatched');
  change('#cloud-consent',true);
  await until(() => !doc.querySelector('#send').disabled, doc);
  doc.querySelector('#composer').requestSubmit();
  assert(socket().sent.some(x => x.type === 'prompt' && x.message === 'draft that must survive'), 'Acknowledged route dispatches the draft');
  assert(prompt.value === '', 'Composer clears after a dispatched prompt');
});

await test('One workspace keeps conversation, agents and code review usable across navigation and session switches', async ({ win,doc,socket }) => {
  socket().frame({ type:'message_start', message:{ role:'user', content:[{ type:'text',text:'first conversation' }] } });
  socket().frame({ type:'message_end', message:{ role:'user', content:[{ type:'text',text:'first conversation' }] } });
  socket().frame({ type:'response',command:'get_subagents',success:true,data:{ subagents:[{ id:'workspace-agent',name:'수정 확인',status:'running' }] } });
  perFileFrame(socket(),{ name:'apply_patch',path:'src/workspace.ts',toolCallId:'workspace-edit',files:[

await test('Inspector tab and timeline mode switches stay synchronous around a scoped swap animation', async ({ win,doc,socket }) => {
  const started = [];
  const native = win.Element.prototype.animate;
  // Record which element animates; the state must already be applied by then.
  win.Element.prototype.animate = function (...args) {
    if (/^pane-|^timeline-groups$/.test(this.id)) started.push({ scope:this.id === 'timeline-groups' ? 'timeline-body' : 'inspector', pane:this.id, selected:doc.querySelector('.insp-tab[aria-selected=true]')?.dataset.tab, raw:doc.querySelector('#timeline-chrono').getAttribute('aria-pressed') });
    return native.apply(this, args);
  };
  try {
    doc.querySelector('#tab-stats').click();
    assert(doc.querySelector('#tab-stats').getAttribute('aria-selected') === 'true' && doc.querySelector('#tab-stats').tabIndex === 0 && !doc.querySelector('#pane-stats').hidden, 'Tab state did not update synchronously');
    const motionReduced = win.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (motionReduced) assert(started.length === 0, 'A transition ran under prefers-reduced-motion');
    else assert(started.length === 1 && started[0].scope === 'inspector' && started[0].selected === 'stats', `Inspector switch did not start a transition scoped to the inspector: ${JSON.stringify(started)}`);
    doc.querySelector('#tab-stats').click();
    assert(started.length === (motionReduced ? 0 : 1), 'Re-selecting the active tab started another transition');
    // The timeline file list lives in a collapsed <details>, so nothing visible swaps
    // and no transition may start until it is open.
    doc.querySelector('#journal-detail').open = false;
    const before = started.length;
    doc.querySelector('#timeline-chrono').click();
    assert(doc.querySelector('#timeline-chrono').getAttribute('aria-pressed') === 'true', 'Timeline mode did not update synchronously');
    assert(started.length === before, 'A hidden timeline started a transition');
    doc.querySelector('#journal-detail').open = true;
    doc.querySelector('#timeline-grouped').click();
    assert(doc.querySelector('#timeline-grouped').getAttribute('aria-pressed') === 'true' && !doc.querySelector('#timeline-groups').hidden, 'Grouped view did not render synchronously');
    if (!motionReduced) assert(started.at(-1)?.scope === 'timeline-body' && started.at(-1).raw === 'false', `Timeline switch did not start a transition scoped to the timeline: ${JSON.stringify(started)}`);
    // Unsupported browsers: no API, same synchronous result and no error.
    Object.defineProperty(win.Element.prototype,'animate',{ value:undefined, configurable:true, writable:true });
    doc.querySelector('#tab-diff').click();
    assert(doc.querySelector('#tab-diff').getAttribute('aria-selected') === 'true' && !doc.querySelector('#pane-diff').hidden, 'Without Web Animations the tab switch broke');
    doc.querySelector('#timeline-chrono').click();
    assert(doc.querySelector('#timeline-chrono').getAttribute('aria-pressed') === 'true', 'Without Web Animations the timeline switch broke');
  } finally {
    win.Element.prototype.animate = native;
  }
});

    const groups = ['.foot-left','.foot-right'].map(selector => doc.querySelector(selector));

    const footerFits = inside(footer,viewport) && groups.every(node => inside(node.getBoundingClientRect(),footer) && node.scrollWidth <= node.clientWidth + 1);
    const footerLineCount = new Set(centers.map(Math.round)).size;
    const title = doc.querySelector('#head-title').getBoundingClientRect();
    layoutMeasurements.push({ width,state,lineCount,controls,footerLineCount,footerFits,submitVisible:controls.at(-1).reachable,titleWidth:title.width });
    assert(controls.every(control => control.reachable), `Unreachable ${state} controls at ${width}: ${controls.filter(x => !x.reachable).map(x => x.name).join(', ')}`);
    assert(lineCount === 1, `Composer controls use ${lineCount} lines at ${width} (${state})`);
    assert(footerLineCount === 1 && footerFits, `Footer wrapped or clipped at ${width} (${state})`);
    assert(title.width >= 120, `Task title is unreadable at ${width}: ${title.width}px`);
  }
  await measure('ready');
  socket().frame({ type:'turn_start' });
  await measure('busy');
  assert(!doc.querySelector('#modes,#scope,#modes-pop'), 'A deleted control is still rendered next to the composer');
});

/* ---------------------------------------------------------- 활동 타임라인 */
const timelineRows = doc => [...doc.querySelectorAll('#timeline-groups .tl-row')];
const timelineGroup = (doc,category) => doc.querySelector(`#timeline-groups .tl-group[data-category="${category}"]`);
const timelineCount = (doc,category) => doc.querySelector(`#timeline-counts .tl-c[data-category="${category}"] b`)?.textContent;
const timelineHeights = [];
function toolFrame(ws,{ name,path,details,toolCallId,isError = false,status = 'completed' }) {
  ws.frame({ type:'tool_execution_start',toolCallId,toolName:name,args:{ path } });
  ws.frame({ type:'tool_execution_end',toolCallId,toolName:name,isError,result:{ content:[{ type:'text',text:status }] },details });
}
/** The create/edit selector (`str_replace_editor`) travels in the start frame arguments only. */
function toolFrameWithArgs(ws,{ name,path,args,toolCallId }) {
  ws.frame({ type:'tool_execution_start',toolCallId,toolName:name,args:{ path,...args } });
  ws.frame({ type:'tool_execution_end',toolCallId,toolName:name,isError:false,result:{ content:[{ type:'text',text:'completed' }] } });
}
/** Per-file results live under `result.details.perFileResults`, the shape the bridge forwards. */
function perFileFrame(ws,{ name,path,toolCallId,files,isError = false }) {
  ws.frame({ type:'tool_execution_start',toolCallId,toolName:name,args:{ path } });
  ws.frame({ type:'tool_execution_end',toolCallId,toolName:name,isError,result:{ content:[{ type:'text',text:'completed' }],details:{ perFileResults:files } } });
}

await test('Design mode inspects the focused control from the keyboard without hijacking Enter', async () => {
  // A blob: document keeps this page's origin, as the real same-origin /preview/ page does,
  // so the inspector's origin-checked postMessage contract is exercised unchanged.
  const page = '<!doctype html><html lang="ko"><body><button id="probe">버튼</button> <button id="other">다른 버튼</button></body></html>';
  const pageUrl = URL.createObjectURL(new Blob([page], { type:'text/html' }));
  const frame = document.createElement('iframe');
  frame.src = pageUrl;
  document.querySelector('#fixture').append(frame);
  try {
    await new Promise(resolve => frame.addEventListener('load', resolve, { once:true }));
    const idoc = frame.contentDocument, iwin = frame.contentWindow;
    await new Promise((resolve, reject) => {
      const script = idoc.createElement('script');
      script.src = new URL('./preview-inspector.js', location.href).href;
      script.addEventListener('load', resolve, { once:true });
      script.addEventListener('error', () => reject(new Error('preview-inspector.js did not load')), { once:true });
      idoc.documentElement.append(script);
    });
    const selected = [];
    const listener = event => { if (event.data?.type === 'omp:element-selected') selected.push(event.data); };
    window.addEventListener('message', listener);
    iwin.postMessage({ type:'omp:design-mode',enabled:true },location.origin);
    await new Promise(resolve => setTimeout(resolve,50));
    const probe = idoc.getElementById('probe');
    probe.focus();
    assert(idoc.getElementById('omp-inspector-overlay').style.display === 'block', 'Keyboard focus did not draw the inspection highlight');
    const activation = new iwin.KeyboardEvent('keydown',{ key:'Enter',bubbles:true,cancelable:true });
    probe.dispatchEvent(activation);
    await new Promise(resolve => setTimeout(resolve,50));
    assert(!activation.defaultPrevented && selected.length === 0, 'A plain Enter was turned into an inspection instead of activating the control');
    // The click Enter/Space produces on a button has no pointerdown before it.
    const other = idoc.getElementById('other');
    const activations = { probe:0,other:0 };
    probe.addEventListener('click', () => activations.probe++);
    other.addEventListener('click', () => activations.other++);
    probe.click();
    await new Promise(resolve => setTimeout(resolve,50));
    assert(activations.probe === 1 && selected.length === 0, `A keyboard-style click was intercepted: ${JSON.stringify({ activations,selected })}`);
    // The pointer then crosses another control; Alt+Enter must still inspect the focused one.
    const box = other.getBoundingClientRect();
    const at = { clientX:box.left + box.width / 2,clientY:box.top + box.height / 2,bubbles:true };
    other.dispatchEvent(new iwin.PointerEvent('pointermove',at));
    probe.dispatchEvent(new iwin.KeyboardEvent('keydown',{ key:'Enter',altKey:true,bubbles:true,cancelable:true }));
    await new Promise(resolve => setTimeout(resolve,120));
    assert(selected.length === 1 && selected[0].selector === '#probe' && selected[0].tag === 'button', `Alt+Enter did not inspect the focused control: ${JSON.stringify(selected)}`);
    // A pointer press still inspects instead of activating.
    other.dispatchEvent(new iwin.PointerEvent('pointerdown',at));
    other.dispatchEvent(new iwin.MouseEvent('click',{ ...at,cancelable:true }));
    await new Promise(resolve => setTimeout(resolve,120));
    assert(selected.length === 2 && selected[1].selector === '#other' && activations.other === 0, `A pointer click did not inspect the pressed control: ${JSON.stringify({ activations,selected })}`);
    window.removeEventListener('message', listener);
  } finally {
    frame.remove();
    URL.revokeObjectURL(pageUrl);
  }
});
