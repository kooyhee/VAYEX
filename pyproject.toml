[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vayex-local-harness"
# Must equal engine.registry.CURATED_APP_RELEASE_VERSION.
version = "2026.11.1"
description = "Local AI coding harness engine and presets"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[tool.setuptools]
packages = ["engine", "harness", "prototype"]
include-package-data = false
zip-safe = false

# No package data at all: model weights are never shipped inside this project.
[tool.setuptools.package-data]
engine = []
harness = []
prototype = []

[tool.setuptools.exclude-package-data]
"*" = ["*.gguf", "*.safetensors", "*.onnx", "*.pt", "*.pth", "*.ckpt", "*.ggml", "*.pq2", "*.bin"]

[tool.harness]
runtime = "omp"
launcher = "launch.ps1"

